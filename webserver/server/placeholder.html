<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ImageThat — UI not built</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #131316;
        color: #ececf1;
        font: 15px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
      code {
        background: #1c1c21;
        border: 1px solid #2e2e36;
        border-radius: 5px;
        padding: 0.1em 0.4em;
      }
      p { color: #9a9aa6; }
    </style>
  </head>
  <body>
    <main>
      <h1>The API is running, but the web UI has not been built.</h1>
      <p>
        Build it with <code>make web</code> in <code>webserver/</code>, then restart the server.
        The bundle is compiled into the binary, so it has to exist before <code>go build</code>.
      </p>
      <p>The JSON API under <code>/api</code> works regardless.</p>
    </main>
  </body>
</html>

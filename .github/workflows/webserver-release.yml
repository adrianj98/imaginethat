name: webserver release

# Two kinds of release:
#
#   merge to main  -> refreshes the rolling "webserver-latest" pre-release
#   webserver-v*   -> cuts a permanent, versioned stable release
#
# The webserver- prefix keeps these distinct from any tagging the macOS app
# uses.
#
# Note there is deliberately no `paths:` filter here. A paths filter applies to
# the whole push block, and a tag push carries no changed files, so adding one
# would silently stop tag releases from ever running. The "Should this build
# release?" step below scopes main pushes to webserver/ changes instead.
on:
  push:
    branches:
      - main
    tags:
      - 'webserver-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. v0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create as a draft (drafts are not visible on the Releases page)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# Merges in quick succession must queue, not race: a cancelled run could leave
# the rolling release with half its assets replaced.
concurrency:
  group: webserver-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version derivation needs tags and history.
          fetch-depth: 0

      - name: Should this build release?
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Tag pushes and manual runs always release.
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A branch being created or force-pushed has no usable "before" SHA.
          # Fail open: releasing a build we did not need beats skipping one we
          # did.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable before-SHA; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "before-SHA $BEFORE not in history; releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            webserver .github/workflows/webserver-release.yml)"

          if [ -n "$changed" ]; then
            echo "Webserver files changed:"
            echo "$changed" | sed 's/^/  /'
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No webserver changes in this push; skipping the release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version and release mode
        id: version
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail

          # git describe fails outright ("fatal: No names found") when no
          # matching tag exists, which is the state of a repo that has never
          # cut a stable release. --always is not a substitute: it returns a
          # bare SHA with no v-prefix.
          if described="$(git describe --tags --match 'webserver-v*' 2>/dev/null)"; then
            version="${described#webserver-}"
          else
            version="v0.0.0-$(git rev-list --count HEAD)-g$(git rev-parse --short HEAD)"
          fi

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              version="${{ inputs.version }}"
              mode=stable
              draft="${{ inputs.draft }}"
              tag="webserver-${version}"
              ;;
            *)
              if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                version="${GITHUB_REF_NAME#webserver-}"
                mode=stable
                draft=false
                tag="$GITHUB_REF_NAME"
              else
                mode=rolling
                draft=false
                tag=webserver-latest
              fi
              ;;
          esac

          {
            echo "version=$version"
            echo "mode=$mode"
            echo "draft=$draft"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Building $version as a $mode release (tag=$tag, draft=$draft)"

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.release == 'true'
        with:
          go-version: '1.24'
          cache-dependency-path: webserver/go.sum

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.release == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webserver/web/package-lock.json

      - name: Sync gocryptfs internal packages
        if: steps.gate.outputs.release == 'true'
        run: make sync
        working-directory: webserver

      # The SPA is compiled into the binary, so it has to exist before any Go
      # build. Building it once keeps every platform's bundle identical.
      - name: Build web UI
        if: steps.gate.outputs.release == 'true'
        run: |
          npm ci
          npm run build
        working-directory: webserver/web

      # No test step here: webserver-ci.yml runs the whole suite on this same
      # commit, so re-running it would only duplicate work. Note this does not
      # gate the release on CI being green — the two workflows are
      # independent — but re-running the tests would not have gated it either.
      #
      # Pure Go with CGO disabled, so every target cross-compiles from one
      # runner. Windows is absent because gocryptfs' syscallcompat is
      # POSIX-only.
      - name: Build release binaries
        if: steps.gate.outputs.release == 'true'
        working-directory: webserver
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.version.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Rolling assets omit the version from the filename so that
          # `gh release upload --clobber` replaces exactly the right asset
          # instead of accumulating one per build — and so the download URL
          # stays stable. Stable releases keep the version in the name.
          slug=""
          if [ "$MODE" = "stable" ]; then
            slug="_${VERSION}"
          fi

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="imagethat-web${slug}_${goos}_${goarch}"
            echo "Building $name (version $VERSION)"

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -tags without_openssl \
                -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/${name}/imagethat-web" \
                ./cmd/imagethat-web

            cp README.md "dist/${name}/" 2>/dev/null || true
            tar -czf "dist/${name}.tar.gz" -C dist "$name"
            rm -rf "dist/${name:?}"
          done

          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          ls -la

      - name: Publish release
        if: steps.gate.outputs.release == 'true'
        working-directory: webserver
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.version.outputs.mode }}
          DRAFT: ${{ steps.version.outputs.draft }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          common_notes=$(cat <<'EOF'
          ## imagethat-web

          A standalone HTTP server that browses gocryptfs vaults: file browser,
          image viewer and range-streamed video, from any browser.

          ### Install

          Download the archive for your platform, verify it against
          `SHA256SUMS`, extract it, and run:

          ```
          ./imagethat-web -root /path/to/your/vaults
          ```

          Then open http://127.0.0.1:8347 and unlock a vault with its password.

          By default the server binds loopback only. To reach it from another
          machine, supply `-tls-cert`/`-tls-key`; it refuses to serve decrypted
          vault contents unencrypted over a network unless you pass
          `-insecure`.

          Vault keys are held in memory only, decrypted content is never
          written to disk, and cached thumbnails are encrypted under a key that
          is destroyed when the vault locks.
          EOF
          )

          if [ "$MODE" = "rolling" ]; then
            title="latest (${VERSION})"
            notes=$(cat <<EOF
          **Rolling development build** — rebuilt on every merge to \`main\`,
          from commit \`${TARGET_SHA}\`. For a fixed version, use a
          \`webserver-v*\` release instead.

          Asset names have no version in them, so these URLs always point at
          the newest build:

          \`\`\`
          https://github.com/${REPO}/releases/download/webserver-latest/imagethat-web_linux_amd64.tar.gz
          \`\`\`

          ${common_notes}
          EOF
          )
          else
            title="imagethat-web ${VERSION}"
            notes="$common_notes"
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; refreshing it"
            # gh release edit --target only moves draft releases, so the tag
            # ref itself has to be repointed at this commit.
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${TAG}" \
              -f sha="$TARGET_SHA" -F force=true > /dev/null
            gh release edit "$TAG" --title "$title" --notes "$notes"
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            args=(--title "$title" --notes "$notes" --target "$TARGET_SHA")
            if [ "$MODE" = "rolling" ]; then
              args+=(--prerelease)
            fi
            if [ "$DRAFT" = "true" ]; then
              args+=(--draft)
              echo "NOTE: creating a DRAFT release — it will not appear on the Releases page until published."
            fi
            gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS "${args[@]}"
          fi

          echo "Published: $(gh release view "$TAG" --json url --jq .url)"

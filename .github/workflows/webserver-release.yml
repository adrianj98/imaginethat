name: webserver release

# Every merge to main that touches the webserver cuts a release, bumping the
# patch version: v0.0.1, v0.0.2, v0.0.3...
#
# There is no tag trigger. The workflow creates the tag itself, so a tag push
# would only ever duplicate a release this job already made. Keeping the
# trigger to branch pushes is also what lets `paths:` work — a filter applies
# to the whole push block, and tag pushes carry no changed files, so mixing the
# two would silently break one of them.
on:
  push:
    branches:
      - main
    paths:
      - 'webserver/**'
      - '.github/workflows/webserver-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.1.0). Leave blank to bump the patch.'
        required: false
        type: string

permissions:
  contents: write

# Merges in quick succession must queue, not race: two runs bumping from the
# same latest tag would both pick the same version number.
concurrency:
  group: webserver-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for the tag list the version bump reads.
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail

          override="${{ inputs.version }}"
          if [ -n "$override" ]; then
            version="${override#v}"
            echo "Using the version given to the manual run: $version"
          else
            # Highest existing release, ignoring anything that is not a plain
            # x.y.z — sort -V orders 0.0.10 after 0.0.9, which a lexical sort
            # would not.
            #
            # The `|| true` is load-bearing: grep exits 1 when nothing matches,
            # and under `set -o pipefail` that would kill the step on the very
            # first release instead of falling through to the default below.
            latest="$(git tag -l 'webserver-v*' \
              | sed 's|^webserver-v||' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1 || true)"

            if [ -z "$latest" ]; then
              version=0.0.1
              echo "No previous release; starting at $version"
            else
              IFS=. read -r major minor patch <<< "$latest"
              version="${major}.${minor}.$((patch + 1))"
              echo "Bumping $latest -> $version"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/webserver-v${version}" > /dev/null; then
            echo "::error::webserver-v${version} already exists"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: webserver/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webserver/web/package-lock.json

      - name: Sync gocryptfs internal packages
        run: make sync
        working-directory: webserver

      # The SPA is compiled into the binary, so it has to exist before any Go
      # build. Building it once keeps every platform's bundle identical.
      - name: Build web UI
        run: |
          npm ci
          npm run build
        working-directory: webserver/web

      # No test step: webserver-ci.yml runs the whole suite on this same
      # commit, so re-running it here would only duplicate work.
      #
      # Pure Go with CGO disabled, so every target cross-compiles from one
      # runner. Windows is absent because gocryptfs' syscallcompat is
      # POSIX-only.
      - name: Build release binaries
        working-directory: webserver
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="imagethat-web_v${VERSION}_${goos}_${goarch}"
            echo "Building $name"

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -tags without_openssl \
                -trimpath \
                -ldflags "-s -w -X main.version=v${VERSION}" \
                -o "dist/${name}/imagethat-web" \
                ./cmd/imagethat-web

            cp README.md "dist/${name}/" 2>/dev/null || true
            tar -czf "dist/${name}.tar.gz" -C dist "$name"
            rm -rf "dist/${name:?}"
          done

          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          ls -la

      - name: Publish release
        working-directory: webserver
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          notes=$(cat <<'EOF'
          ## imagethat-web

          A standalone HTTP server that browses gocryptfs vaults: file browser,
          image viewer and range-streamed video, from any browser.

          ### Install

          Download the archive for your platform, verify it against
          `SHA256SUMS`, extract it, and run:

          ```
          ./imagethat-web -root /path/to/your/vaults
          ```

          Then open http://127.0.0.1:8347 and unlock a vault with its password.

          By default the server binds loopback only. To reach it from another
          machine, supply `-tls-cert`/`-tls-key`; it refuses to serve decrypted
          vault contents unencrypted over a network unless you pass
          `-insecure`.

          Vault keys are held in memory only, decrypted content is never
          written to disk, and cached thumbnails are encrypted under a key that
          is destroyed when the vault locks.
          EOF
          )

          # gh creates the tag at --target, so the workflow never has to push
          # a ref itself.
          gh release create "webserver-v${VERSION}" \
            dist/*.tar.gz dist/SHA256SUMS \
            --target "$TARGET_SHA" \
            --title "imagethat-web v${VERSION}" \
            --notes "$notes"

          echo "Published: $(gh release view "webserver-v${VERSION}" --json url --jq .url)"

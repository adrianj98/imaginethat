name: webserver CI

on:
  push:
    branches: ['**']
    paths:
      - 'webserver/**'
      - '.github/workflows/webserver-ci.yml'
  pull_request:
    paths:
      - 'webserver/**'
      - '.github/workflows/webserver-ci.yml'
  workflow_dispatch:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: webserver-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webserver

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: webserver/go.mod
          cache-dependency-path: webserver/go.sum

      # gocryptfs' crypto lives in internal/ packages that another module
      # cannot import, so they are copied in rather than committed.
      - name: Sync gocryptfs internal packages
        run: make sync

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./vault ./server ./cmd)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: make vet

      # The interop test mounts a vault with the real gocryptfs binary and
      # checks it agrees with what this module wrote. Without it the write
      # tests would only prove we can read back our own output.
      - name: Install gocryptfs for interop tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          go install -tags without_openssl github.com/rfjakob/gocryptfs/v2@v2.6.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test
        run: make test

      - name: Test with race detector
        run: go test -tags without_openssl -race ./vault/... ./server/...

      - name: Build
        run: make build

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webserver/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: webserver/web

      - name: Typecheck
        run: npm run typecheck
        working-directory: webserver/web

      - name: Build
        run: npm run build
        working-directory: webserver/web

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: webserver/go.mod
          cache-dependency-path: webserver/go.sum

      - name: Sync gocryptfs internal packages
        run: make sync

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags without_openssl -o /dev/null ./cmd/imagethat-web

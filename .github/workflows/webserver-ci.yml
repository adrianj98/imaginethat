name: webserver CI

on:
  push:
    branches: ['**']
    paths:
      - 'webserver/**'
      - 'core/**'
      - '.github/workflows/webserver-ci.yml'
  pull_request:
    paths:
      - 'webserver/**'
      - 'core/**'
      - '.github/workflows/webserver-ci.yml'
  workflow_dispatch:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: webserver-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webserver

jobs:
  go:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Newest 1.26.x so builds get Go patch releases (go.mod toolchain is the floor).
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: |
            webserver/go.sum
            core/go.sum

      # gocryptfs' crypto lives in internal/ packages that another module
      # cannot import, so they are copied into ../core rather than committed.
      - name: Sync gocryptfs internal packages
        run: make sync

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./server ./cmd)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: make vet

      # The vault engine's own tests (including the gocryptfs interop test)
      # run in core-ci.yml; this job covers the HTTP layer.
      - name: Test
        run: make test

      - name: Test with race detector
        run: go test -tags without_openssl -race ./server/...

      - name: Build
        run: make build

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webserver/web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: webserver/web

      - name: Typecheck
        run: npm run typecheck
        working-directory: webserver/web

      - name: Build
        run: npm run build
        working-directory: webserver/web

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Newest 1.26.x so builds get Go patch releases (go.mod toolchain is the floor).
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: |
            webserver/go.sum
            core/go.sum

      - name: Sync gocryptfs internal packages
        run: make sync

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags without_openssl -o /dev/null ./cmd/imagethat-web

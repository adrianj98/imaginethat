name: android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'webserver/vault/**'
      - 'webserver/mobile/**'
      - 'webserver/go.mod'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'webserver/vault/**'
      - 'webserver/mobile/**'
      - 'webserver/go.mod'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.1.10909125

jobs:
  go:
    name: Go engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: webserver/go.mod
          cache-dependency-path: webserver/go.sum

      - name: Sync gocryptfs internal packages
        run: make sync
        working-directory: webserver

      - name: Test
        run: go test -short -tags without_openssl ./vault/... ./mobile/...
        working-directory: webserver

  app:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/android-setup

      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
        working-directory: android

  instrumented:
    name: Instrumented tests (API 34)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/android-setup

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: cd android && ./gradlew :app:connectedDebugAndroidTest

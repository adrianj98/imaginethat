name: Android build environment
description: JDK 21, Android SDK + NDK, Go and gomobile, everything vaultcore.aar and Gradle need.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - uses: gradle/actions/setup-gradle@v4

    - uses: actions/setup-go@v5
      with:
        # Newest 1.26.x so builds get Go patch releases (go.mod toolchain is the floor).
        go-version: '1.26'
        check-latest: true
        cache-dependency-path: core/go.sum

    # ubuntu-latest ships the SDK; this only adds the pieces the build pins.
    - name: Install Android NDK and platform
      shell: bash
      run: |
        set -euo pipefail
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

    # gomobile is pinned to the version in core/go.mod, which also keeps
    # its golang.org/x/mobile/bind sources in step with the generated glue.
    - name: Install gomobile
      shell: bash
      working-directory: core
      run: |
        set -euo pipefail
        v="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
        go install "golang.org/x/mobile/cmd/gomobile@${v}" "golang.org/x/mobile/cmd/gobind@${v}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        "$(go env GOPATH)/bin/gomobile" init
